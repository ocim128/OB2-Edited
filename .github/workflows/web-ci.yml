name: OpenBullet2 Web CI

on:
  push:
    paths:
      - "OpenBullet2.Web/**"
      - "OpenBullet2.Shared/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "OpenBullet2.Web/**"
      - "OpenBullet2.Shared/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore OpenBullet2.Web/OpenBullet2.Web.Api/OpenBullet2.Web.Api.csproj
      - name: Build
        run: dotnet build OpenBullet2.Web/OpenBullet2.Web.Api/OpenBullet2.Web.Api.csproj --configuration Release --no-restore
      - name: Test shared library
        run: dotnet test OpenBullet2.Shared.Tests/OpenBullet2.Shared.Tests.csproj --configuration Release --no-build
      - name: Test web API
        run: dotnet test OpenBullet2.Web.Api.Tests/OpenBullet2.Web.Api.Tests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: OpenBullet2.Web/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: OpenBullet2.Web/client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run e2e tests
        env:
          CI: "true"
        run: npm run test:e2e
