name: OpenBullet2 Web CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: dev
            image_tag: dev
            kube_secret: KUBE_CONFIG_DEV
            ingress_host: dev.ob2.example.com
          - environment: staging
            image_tag: staging
            kube_secret: KUBE_CONFIG_STAGING
            ingress_host: staging.ob2.example.com
          - environment: prod
            image_tag: latest
            kube_secret: KUBE_CONFIG_PROD
            ingress_host: ob2.example.com
    if: ${{ github.event.inputs.environment == matrix.environment }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OpenBullet2.Web/deploy/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ob2-web-api:${{ matrix.image_tag }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OpenBullet2.Web/deploy/Dockerfile.client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ob2-web-client:${{ matrix.image_tag }}
          build-args: |
            VITE_API_URL=https://api.${{ matrix.ingress_host }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${KUBE_CONFIG}" > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets[matrix.kube_secret] }}

      - name: Deploy API resources
        run: |
          kubectl set image deployment/ob2-web-api api=ghcr.io/${{ github.repository_owner }}/ob2-web-api:${{ matrix.image_tag }} --record || kubectl apply -f OpenBullet2.Web/deploy/k8s/api.yaml

      - name: Deploy client resources
        run: |
          kubectl set image deployment/ob2-web-client client=ghcr.io/${{ github.repository_owner }}/ob2-web-client:${{ matrix.image_tag }} --record || kubectl apply -f OpenBullet2.Web/deploy/k8s/client.yaml

      - name: Apply ingress
        env:
          INGRESS_HOST: ${{ matrix.ingress_host }}
        run: |
          envsubst < OpenBullet2.Web/deploy/k8s/ingress.yaml | kubectl apply -f -
